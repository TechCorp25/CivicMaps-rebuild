name: Dependency advisory review

on:
  schedule:
    - cron: '18 5 * * 1'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm run setup
      - name: Audit locked production and complete dependency trees
        run: npm run audit:dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisory-reports
          path: test-results/dependency-audit/*.json
          if-no-files-found: warn
