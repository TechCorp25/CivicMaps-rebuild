name: Implemented application checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-bookworm@sha256:d4a8e1f88f475ee3e0137fa89d21ebc59f6c6ab16bf369ee92907607cc3455ae
        env:
          POSTGRES_USER: civicmaps_local
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicmaps_local -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CIVICMAPS_DATABASE_URL: postgresql://civicmaps_local:synthetic-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm run setup
      - name: Check apps, APIs and provisioning worker restart recovery
        run: npm run check
      - name: Verify generated tokens are committed
        run: git diff --exit-code -- apps/commandmaps/src/tokens.css apps/civicmaps-platform/src/tokens.css
      - name: Verify actual Caddy ingress and sign-in client isolation
        run: |
          curl -fsSL https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz -o /tmp/civicmaps-caddy.tar.gz
          printf '%s  %s\n' '747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546' /tmp/civicmaps-caddy.tar.gz | sha512sum -c -
          mkdir /tmp/civicmaps-caddy
          tar -xzf /tmp/civicmaps-caddy.tar.gz -C /tmp/civicmaps-caddy caddy
          CIVICMAPS_CADDY_BINARY=/tmp/civicmaps-caddy/caddy node tests/ingress-contract.mjs
          CIVICMAPS_CADDY_BINARY=/tmp/civicmaps-caddy/caddy node tests/ingress-login.mjs
      - name: Install Chromium for platform acceptance
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise platform registration, provisioning and pack flows
        run: npm run test:platform:browser
      - name: Exercise CommandMAPS in a disposable database
        run: npm run test:commandmaps:browser
      - name: Exercise first council-admin activation in a disposable database
        run: npm run test:activation:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-browser-evidence
          path: test-results/*.png
          if-no-files-found: ignore
