name: Implemented application checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-bookworm@sha256:d4a8e1f88f475ee3e0137fa89d21ebc59f6c6ab16bf369ee92907607cc3455ae
        env:
          POSTGRES_USER: civicmaps_local
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicmaps_local -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CIVICMAPS_DATABASE_URL: postgresql://civicmaps_local:synthetic-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - run: npm run setup
      - name: Check CommandMAPS, Platform and foundation API
        run: npm run check
      - name: Verify generated tokens are committed
        run: git diff --exit-code -- apps/commandmaps/src/tokens.css apps/civicmaps-platform/src/tokens.css
