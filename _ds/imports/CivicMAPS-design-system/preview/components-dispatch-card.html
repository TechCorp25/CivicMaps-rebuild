<!doctype html>
<!-- @dsCard group="Components" name="Dispatch card" subtitle="Active Code21 card with Acknowledge CTA" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--civic-surface-raised);font-family:var(--font-primary)}
.card{background:#fff;border:1px solid #D5D9E0;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);padding:14px 16px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.addr{font-size:14px;font-weight:600;color:#111827}
.type{font-size:12px;color:#636E80;margin-top:2px;font-family:var(--font-mono)}
.desc{font-size:12px;color:#4A5568;margin-top:8px;line-height:1.5}
.meta{font-size:11px;color:#8892A2;margin-top:6px;font-family:var(--font-mono)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#FFFBEB;color:#B45309;border:1px solid #FDE68A}
.d{width:6px;height:6px;border-radius:99px;background:currentColor}
.ack{margin-top:10px;background:#2563EB;color:#fff;font-size:13px;font-weight:600;padding:8px 0;text-align:center;border-radius:8px}
</style></head><body>
<div class="card">
  <div class="row">
    <div>
      <div class="addr">47 Collins St · Melbourne</div>
      <div class="type">Code21 · Unattended vehicle</div>
    </div>
    <span class="badge"><span class="d"></span>Dispatched</span>
  </div>
  <div class="desc">Silver hatchback double-parked across bike lane. Driver not present. Requester: pedestrian 0412 446 *** .</div>
  <div class="meta">SR-2026-00871 · 14:32 AEDT · 180m from Z-MAC</div>
  <div class="ack">Acknowledge</div>
</div></body></html>
