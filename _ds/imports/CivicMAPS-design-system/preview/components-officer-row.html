<!doctype html>
<!-- @dsCard group="Components" name="Officer row" subtitle="Assignments — abbreviated position prefix (PR / PEO / PCL), presence dot + actions" viewport="700x170" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:var(--civic-surface);font-family:var(--font-primary)}
.card{border:1px solid #D5D9E0;border-radius:8px;background:#fff;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.a{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:10px;height:10px;border-radius:99px;background:#23A392;flex-shrink:0}
.name{font-size:14px;font-weight:600;color:#111827}
.mono{font-family:var(--font-mono);font-size:12px;color:#636E80;margin-top:2px}
.actions{display:flex;gap:6px}
.btn{font-size:11px;padding:4px 10px;border-radius:6px;background:#EFF6FF;color:#2563EB;font-weight:600;border:none}
.btn.end{background:#FEF2F2;color:#DC2626}
.status{font-family:var(--font-mono);font-size:10px;color:#636E80;display:flex;gap:6px;align-items:center}
.pill{background:#F0FDF4;color:#166534;border:1px solid #BBF7D0;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
</style></head><body>
<div class="card">
  <div class="a"><div class="dot"></div><div><div class="name">Samantha Carn</div><div class="mono">PCL-0123 · Z-MAC · Macaulay</div></div></div>
  <div class="status"><span class="pill">CODE 2</span></div>
  <div class="actions"><button class="btn">Reassign</button><button class="btn end">End</button></div>
</div>
<div class="card">
  <div class="a"><div class="dot" style="background:#9CA3AF"></div><div><div class="name">Arben M.</div><div class="mono">PR-0142 · Unassigned</div></div></div>
  <div></div>
  <div class="actions"><button class="btn" style="background:#F0FDF4;color:#16A34A">Assign officer</button></div>
</div>
</body></html>
