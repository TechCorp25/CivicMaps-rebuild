<!doctype html>
<!-- @dsCard group="Colors" name="Secondary & accent" subtitle="Operations Teal · Patrol Gold" viewport="700x220" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:16px;background:var(--civic-surface);font-family:var(--font-primary)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:110px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--civic-neutral-200)}
.chip{height:64px;display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:600}
.meta{padding:6px 10px;font-size:11px;line-height:1.3}
.meta b{display:block;font-size:12px;color:var(--civic-neutral-900);font-weight:600}
.meta span{color:var(--civic-neutral-500);font-family:var(--font-mono)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#1A7A6D">1A7A6D</div><div class="meta"><b>Operations Teal</b><span>--civic-secondary</span></div></div>
  <div class="sw"><div class="chip" style="background:#23A392">23A392</div><div class="meta"><b>Teal · Light</b><span>--civic-secondary-light</span></div></div>
  <div class="sw"><div class="chip" style="background:#115A50">115A50</div><div class="meta"><b>Teal · Dark</b><span>--civic-secondary-dark</span></div></div>
  <div class="sw"><div class="chip" style="background:#D4A843;color:#111827">D4A843</div><div class="meta"><b>Patrol Gold</b><span>--civic-accent</span></div></div>
  <div class="sw"><div class="chip" style="background:#E8C46A;color:#111827">E8C46A</div><div class="meta"><b>Gold · Light</b><span>--civic-accent-light</span></div></div>
  <div class="sw"><div class="chip" style="background:#B08A2E">B08A2E</div><div class="meta"><b>Gold · Dark</b><span>--civic-accent-dark</span></div></div>
</div></body></html>
