<!doctype html>
<!-- @dsCard group="Components" name="Bottom sheet" subtitle="Mobile zone-detail sheet" viewport="700x280" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:16px;background:#ECEEF2;font-family:var(--font-primary);display:flex;justify-content:center}
.phone{width:280px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.12);border:1px solid #D5D9E0}
.handle{width:40px;height:4px;background:#B0B7C3;border-radius:99px;margin:8px auto 12px}
.ttl{font-size:14px;font-weight:700;padding:0 14px;color:#111827}
.sub{font-size:11px;color:#636E80;padding:4px 14px 10px;font-family:var(--font-mono)}
.row{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ECEEF2;font-size:12px;color:#374151}
.btn{background:#1B2A4A;color:#fff;margin:12px 14px;padding:12px;border-radius:10px;text-align:center;font-weight:600;font-size:13px}
</style></head><body>
<div class="phone">
  <div class="handle"></div>
  <div class="ttl">Zone Z-MAC · Macaulay</div>
  <div class="sub">OFC-0142 assigned · 42 min ago</div>
  <div class="row"><span>Officer</span><span style="font-family:var(--font-mono)">Arben M · OFC-0142</span></div>
  <div class="row"><span>Status</span><span style="color:#16A34A;font-weight:600">On patrol</span></div>
  <div class="row"><span>Code 2</span><span>Logged 14:12</span></div>
  <div class="btn">End assignment</div>
</div></body></html>
