<!doctype html>
<!-- @dsCard group="UI Kit — Enforcementmaps" name="EnforcementMAPS" subtitle="Android officer app — patrol, dispatch, PTT, jobs" viewport="430x860" -->
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<title>EnforcementMAPS — UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--map-canvas); font-family: var(--font-primary); display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
  #device { width: 390px; height: 800px; background: #000; border-radius: 34px; padding: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.5); position: relative; }
  #screen { width: 100%; height: 100%; border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; background: #fff; position: relative; }
  button { font-family: var(--font-primary); }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="device"><div id="screen"></div></div>
<script type="text/babel" src="MobileShell.jsx"></script>
<script type="text/babel" src="Patrol.jsx"></script>
<script type="text/babel" src="OtherScreens.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [officer, setOfficer] = useState(null);
  const [tab, setTab] = useState('map');
  const [sheet, setSheet] = useState(null);
  const [alert, setAlert] = useState(null);

  // Auto-show incoming Code21 2.5s after login
  useEffect(() => {
    if (!officer) return;
    const t = setTimeout(() => setSheet({
      sr: 'SR-2026-0418-042',
      address: '412 Elizabeth St',
      type: 'Parking violation',
      desc: 'Silver sedan parked across loading zone. Blocking delivery access — reported by business owner.'
    }), 2500);
    return () => clearTimeout(t);
  }, [officer]);

  if (!officer) return React.createElement('div', { style: { flex: 1, display: 'flex', flexDirection: 'column' } },
    React.createElement(StatusBar, null),
    React.createElement(EmLogin, { onLogin: setOfficer }));

  const code1Alert = () => setAlert({ kind: 'CODE1' });

  return React.createElement(React.Fragment, null,
    React.createElement(StatusBar, null),
    React.createElement(AppHeader, {
      title: tab === 'map' ? 'Patrol' : tab === 'ptt' ? 'Push to Talk' : tab === 'jobs' ? 'Jobs' : 'Profile',
      subtitle: tab === 'map' ? officer.id + ' · ' + officer.zone : null,
      right: React.createElement('button', { style: { background: 'rgba(255,255,255,.14)', border: 'none', width: 36, height: 36, borderRadius: 99, color: '#fff', display: 'grid', placeItems: 'center', cursor: 'pointer' } }, React.createElement(EmIcon, { name: 'Bell', size: 18 }))
    }),
    alert && alert.kind === 'CODE1' && React.createElement('div', { className: 'civic-code1-banner civic-code1-banner--mobile', role: 'alert', 'aria-live': 'assertive' },
      React.createElement('span', { className: 'civic-code1-dot', 'aria-hidden': 'true' }),
      React.createElement('span', { className: 'civic-code1-tag' }, 'CODE 1'),
      React.createElement('div', { className: 'civic-code1-text' },
        'SOS broadcast sent. Command notified.'),
      React.createElement('button', { onClick: () => setAlert(null), className: 'civic-code1-action' }, 'CLEAR'),
      React.createElement('span', { className: 'civic-code1-dot', 'aria-hidden': 'true' })),
    tab === 'map' && React.createElement(PatrolMap, {
      zone: officer.zone, activeJob: sheet, onJobTap: () => setSheet({
        sr: 'SR-2026-0418-042', address: '412 Elizabeth St', type: 'Parking violation',
        desc: 'Silver sedan parked across loading zone. Blocking delivery access — reported by business owner.'
      }), onCode1: code1Alert
    }),
    tab === 'ptt' && React.createElement(PTTScreen, { onCode1: code1Alert }),
    tab === 'jobs' && React.createElement(JobsScreen, null),
    tab === 'profile' && React.createElement(ProfileScreen, { officer, onLogout: () => setOfficer(null) }),
    React.createElement(TabBar, { active: tab, onSelect: setTab }),
    sheet && tab === 'map' && React.createElement(DispatchSheet, {
      job: sheet,
      onAck: () => { setSheet(null); alert && setAlert(null); },
      onClose: () => setSheet(null)
    })
  );
}

ReactDOM.createRoot(document.getElementById('screen')).render(React.createElement(App));
</script>
</body>
</html>
