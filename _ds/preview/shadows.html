<!doctype html>
<!-- @dsCard group="Spacing" name="Shadow" subtitle="sm / md / lg / xl elevation" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--civic-surface-raised);font-family:var(--font-primary);display:flex;gap:20px}
.b{background:#fff;width:110px;height:68px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--civic-neutral-600);flex-direction:column}
.l{font-family:var(--font-mono);font-size:10px;color:var(--civic-neutral-400);margin-top:2px}
</style></head><body>
<div class="b" style="box-shadow:0 1px 2px rgba(0,0,0,.06)">sm<div class="l">card rest</div></div>
<div class="b" style="box-shadow:0 2px 8px rgba(0,0,0,.10)">md<div class="l">hover</div></div>
<div class="b" style="box-shadow:0 4px 16px rgba(0,0,0,.12)">lg<div class="l">popover</div></div>
<div class="b" style="box-shadow:0 8px 32px rgba(0,0,0,.16)">xl<div class="l">sheet / modal</div></div>
</body></html>
