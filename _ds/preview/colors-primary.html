<!doctype html>
<!-- @dsCard group="Colors" name="Primary colors" subtitle="Civic Navy scale" viewport="700x140" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:16px;background:var(--civic-surface);font-family:var(--font-primary)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:110px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--civic-neutral-200)}
.chip{height:64px;display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:600}
.meta{padding:6px 10px;background:var(--civic-surface);font-size:11px;line-height:1.3}
.meta b{display:block;font-family:var(--font-primary);font-size:12px;color:var(--civic-neutral-900);font-weight:600}
.meta span{color:var(--civic-neutral-500);font-family:var(--font-mono)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#1B2A4A">1B2A4A</div><div class="meta"><b>Civic Navy</b><span>--civic-primary</span></div></div>
  <div class="sw"><div class="chip" style="background:#2C3E6B">2C3E6B</div><div class="meta"><b>Civic Navy · Light</b><span>--civic-primary-light</span></div></div>
  <div class="sw"><div class="chip" style="background:#0F1A32">0F1A32</div><div class="meta"><b>Civic Navy · Dark</b><span>--civic-primary-dark</span></div></div>
</div></body></html>
