<!doctype html>
<!-- @dsCard group="Brand" name="Map motif" subtitle="Map as hero — zones + officer markers" viewport="700x220" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:0;background:#0B1220;font-family:var(--font-primary);height:220px;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(#1A2940 1px,transparent 1px),linear-gradient(90deg,#1A2940 1px,transparent 1px);background-size:32px 32px;opacity:.5}
.road{position:absolute;height:2px;background:#2C3E6B;left:0;right:0}
.zone{position:absolute;border:2px solid #1A7A6D;background:rgba(26,122,109,.18);border-radius:6px}
.marker{position:absolute;width:26px;height:26px;border-radius:50%;background:#16A34A;border:2px solid #fff;box-shadow:0 0 0 4px rgba(22,163,74,.25);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9px;color:#fff;font-weight:700}
.emer{background:#DC2626;box-shadow:0 0 0 4px rgba(220,38,38,.3)}
.ttl{position:absolute;left:16px;top:14px;color:#F7F8FA;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.sub{position:absolute;left:16px;top:34px;color:#D4A843;font-family:var(--font-mono);font-size:10px}
</style></head><body>
<div class="grid"></div>
<div class="road" style="top:70px"></div><div class="road" style="top:150px"></div>
<div class="zone" style="left:30px;top:80px;width:140px;height:60px"></div>
<div class="zone" style="left:210px;top:80px;width:120px;height:60px;border-color:#D4A843;background:rgba(212,168,67,.15);border-style:dashed"></div>
<div class="zone" style="left:360px;top:80px;width:140px;height:60px"></div>
<div class="marker" style="left:80px;top:95px">142</div>
<div class="marker emer" style="left:240px;top:95px">118</div>
<div class="marker" style="left:420px;top:95px">089</div>
<div class="ttl">Map · Melbourne CBD</div>
<div class="sub">Z-MAC · Z-ELZ · Z-CBN · 3 officers live</div>
</body></html>
