<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Wordmark + product lock-ups" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:#F7F8FA;font-family:var(--font-primary)}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:10px;background:#1B2A4A;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.mark svg{width:28px;height:28px}
.word{display:flex;flex-direction:column}
.a{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;color:#1B2A4A;letter-spacing:-.01em;line-height:1}
.b{font-family:var(--font-mono);font-size:10px;color:#636E80;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.row{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid #ECEEF2}
.dark{background:#0F1A32;color:#fff;padding:10px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:10px}
.dark .a{color:#fff}
.dark .b{color:#D4A843}
.ia{color:#D4A843}
</style></head><body>
<div class="logo"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="word"><div class="a">CivicMAPS</div><div class="b">Municipal Area Patrol System</div></div></div>
<div class="row">
  <div class="dark"><div class="mark" style="width:26px;height:26px;border-radius:6px;background:transparent"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/></svg></div><span class="a">CommandMAPS</span></div>
  <div class="dark" style="background:#115A50"><div class="mark" style="width:26px;height:26px;border-radius:6px;background:transparent"><svg viewBox="0 0 24 24" fill="none" stroke="#D4A843" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5 8 12 8 12s8-7 8-12a8 8 0 0 0-8-8z"/></svg></div><span class="a">EnforcementMAPS</span></div>
</div>
</body></html>
