<!doctype html>
<!-- @dsCard group="Components" name="KPI tiles" subtitle="Dashboard snapshot — mono + dot" viewport="700x120" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:16px;background:#fff;font-family:var(--font-primary)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.tile{flex:1;min-width:130px;background:#fff;border:1px solid #D5D9E0;border-radius:10px;padding:12px 14px}
.lbl{font-size:11px;color:#636E80;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.v{font-family:var(--font-mono);font-size:24px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px}
.d{width:8px;height:8px;border-radius:99px}
</style></head><body>
<div class="row">
  <div class="tile"><div class="lbl">Active zones</div><div class="v"><span class="d" style="background:#2563EB"></span>14/17</div></div>
  <div class="tile"><div class="lbl">Online officers</div><div class="v"><span class="d" style="background:#16A34A"></span>12/14</div></div>
  <div class="tile"><div class="lbl">Code 2 logged</div><div class="v"><span class="d" style="background:#7C3AED"></span>9</div></div>
  <div class="tile"><div class="lbl">Unassigned C21</div><div class="v"><span class="d" style="background:#DC2626"></span>3</div></div>
</div></body></html>
